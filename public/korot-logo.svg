<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Korot logo</title>
  <desc id="desc">Korot brand mark and wordmark in teal and gold.</desc>
  <defs>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0%" stop-color="#0B5D5A" />
      <stop offset="100%" stop-color="#0D7A6E" />
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#F5C84D" />
